services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_FRONTEND_PORT: ${FRONTEND_PORT}
    container_name: frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    volumes:
      - ./frontend/config:/config
      - ./frontend/data:/data
    networks:
      - web_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
      gateway:
        condition: service_started
  backend:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: backend
    restart: unless-stopped
    volumes:
      - ./backend/pb_data:/pb_data
      - ./backend/pb_public:/pb_public
      - ./backend/pb_migrations:/pb_migrations
      - ./backend/pb_hooks:/pb_hooks:ro
      - ./backend/entrypoint.sh:/entrypoint.sh
    env_file:
      - .env
    networks:
      - web_network
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8090/api/health || exit 1
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 10s
    entrypoint: ["/entrypoint.sh"]
  gateway:
    image: node:24-alpine
    container_name: gateway
    restart: unless-stopped
    command: ["node", "/app/server/admin-gateway.mjs"]
    volumes:
      - ./server:/app/server:ro
    environment:
      PORT: 3001
      PB_URL: http://backend:8090
      PB_ADMIN_EMAIL: ${BACKEND_ADMIN_EMAIL}
      PB_ADMIN_PASSWORD: ${BACKEND_ADMIN_PASSWORD}
    networks:
      - web_network
    depends_on:
      backend:
        condition: service_healthy

networks:
  web_network:
    name: web_network
    driver: bridge
